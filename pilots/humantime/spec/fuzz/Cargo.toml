[package]
name = "humantime-pilot-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
humantime = { path = ".." }
# independent RFC 3339 implementation for target rfc3339_vs_time (E-6/E-7); fuzz workspace only
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }

# Own workspace: the fuzz crate never enters the crate's build.
[workspace]
members = ["."]

[[bin]]
name = "duration_roundtrip"
path = "fuzz_targets/duration_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_no_panic"
path = "fuzz_targets/parse_no_panic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rfc3339_shape"
path = "fuzz_targets/rfc3339_shape.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rfc3339_vs_time"
path = "fuzz_targets/rfc3339_vs_time.rs"
test = false
doc = false
bench = false
