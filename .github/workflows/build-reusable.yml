# S4: isolated, reusable build. Produces an auditable binary, a CycloneDX SBOM,
# SLSA build provenance and an SBOM attestation (Sigstore, GitHub OIDC).
# Called only via workflow_call -> signer identity is THIS file (SLSA Build L3 pattern).
name: build-reusable

on:
  workflow_call:
    outputs:
      binary-sha256:
        description: sha256 of the release binary built here
        value: ${{ jobs.build.outputs.binary-sha256 }}

permissions: {}

jobs:
  build:
    name: build + attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      binary-sha256: ${{ steps.package.outputs.binary-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        with:
          toolchain: "1.100.0"

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-auditable@0.7.7,cargo-cyclonedx@0.5.10

      - name: Build (auditable, locked)
        run: cargo auditable build --release --locked

      - name: Package binary, SBOM, checksums
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/rust-cicd-core dist/rust-cicd-core-x86_64-unknown-linux-gnu
          cargo cyclonedx --format json --spec-version 1.5
          sbom="$(find . -maxdepth 1 -name '*.cdx.json' -print -quit)"
          test -n "$sbom"
          mv "$sbom" dist/rust-cicd-core.cdx.json
          (cd dist && sha256sum rust-cicd-core-x86_64-unknown-linux-gnu rust-cicd-core.cdx.json > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "binary-sha256=$(sha256sum dist/rust-cicd-core-x86_64-unknown-linux-gnu | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: prov
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rust-cicd-core-x86_64-unknown-linux-gnu

      - name: Attest SBOM
        id: sbomatt
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/rust-cicd-core-x86_64-unknown-linux-gnu
          sbom-path: dist/rust-cicd-core.cdx.json

      - name: Add Sigstore bundles to the release set
        env:
          PROV_BUNDLE: ${{ steps.prov.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbomatt.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROV_BUNDLE" && test -s "$SBOM_BUNDLE"
          cp "$PROV_BUNDLE" dist/rust-cicd-core-x86_64-unknown-linux-gnu.provenance.sigstore.json
          cp "$SBOM_BUNDLE" dist/rust-cicd-core-x86_64-unknown-linux-gnu.sbom.sigstore.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
