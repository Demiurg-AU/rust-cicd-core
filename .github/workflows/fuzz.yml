# Fuzzing (threat CI-8, ROADMAP P5). Pinned nightly + pinned cargo-fuzz; configuration only
# (fuzz/fuzz-targets.tsv, fuzz/fuzz-canaries.tsv, scripts/fuzz-gate.sh). Each target compares the real
# code with an independent reference; each canary plants a bug in the REAL code and the REAL target
# must crash for its reason first. Fuzz code runs jailed (CI-9). The corpus persists between runs:
# restored on every run, saved only by runs on main (PR runs cannot write a cache main reads).
name: fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # every PR, with no path filter: a required check must report on every PR, or a PR it skipped could not
  # merge (CI-8, owner decision #63, 2026-11-26)
  pull_request:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-15
      # the prebuilt cargo-fuzz is a musl binary and defaults --target to its own triple; ASan needs glibc
      FUZZ_TARGET: x86_64-unknown-linux-gnu
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '900' || '60' }}
      FUZZ_CANARY_SECONDS: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        with:
          toolchain: nightly-2026-11-15
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-fuzz@0.13.2,cargo-audit@0.23.0
      - name: Jail for code under test (bubblewrap; threat CI-9)
        # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor; the VM is ephemeral, so lift it here.
        run: |
          set -euo pipefail
          command -v bwrap >/dev/null || { sudo apt-get update -q; sudo apt-get install -y -q bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent true
      - name: Jail probe - no writes to runner files, no unix socket (docker.sock), no network
        run: |
          set -uo pipefail
          . scripts/sandbox.sh; export SANDBOX_WORK="$(mktemp -d)"; sandbox_enable
          if sandbox_probe "$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; then exit 1; fi
          rc=0; sandbox_probe_sockets "$(mktemp -d)" || rc=$?; [ "$rc" -eq 1 ] || exit 1
      - name: Audit fuzz-only dependencies (separate lockfile)
        run: cargo audit -f fuzz/Cargo.lock
      - name: Canaries - a bug planted in the real code must crash the real target
        run: bash scripts/fuzz-gate.sh canary . "$RUNNER_TEMP/fuzz/canaries"
      - name: Restore corpus (latest saved by main)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every listed target
        run: bash scripts/fuzz-gate.sh run . "$RUNNER_TEMP/fuzz/run"
      - name: Save corpus (main only)
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload results and crash inputs (crashes become regression tests)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz
            fuzz/artifacts
          if-no-files-found: ignore
