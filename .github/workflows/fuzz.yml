# Fuzzing (threat CI-8). Pinned nightly + pinned cargo-fuzz. A canary target with a planted
# overflow bug MUST crash first: a fuzzer that cannot find a known bug proves nothing.
name: fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["fuzz/**", "src/**", ".github/workflows/fuzz.yml"]

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-15
      # the prebuilt cargo-fuzz is a musl binary and defaults --target to its own triple; ASan needs glibc
      FUZZ_TARGET: x86_64-unknown-linux-gnu
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '900' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        with:
          toolchain: nightly-2026-11-15
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-fuzz@0.13.2,cargo-audit@0.23.0
      - name: Audit fuzz-only dependencies (separate lockfile)
        run: cargo audit -f fuzz/Cargo.lock
      - name: Canary - the fuzzer must catch the planted bug
        run: |
          set -uo pipefail
          if cargo fuzz run --target "$FUZZ_TARGET" canary_wrapping_add -- -seed=1 -max_total_time=120 > canary.log 2>&1; then
            echo "FUZZ canary not caught"; tail -20 canary.log; exit 1
          fi
          grep -q 'FUZZ-ORACLE canary' canary.log && grep -q 'deadly signal' canary.log \
            || { echo "FUZZ canary failed for the wrong reason"; tail -40 canary.log; exit 1; }
          echo "FUZZ canary caught"; rm -rf fuzz/artifacts/canary_wrapping_add
      - name: Fuzz checked_add
        run: cargo fuzz run --target "$FUZZ_TARGET" checked_add -- -max_total_time="$FUZZ_SECONDS"
      - name: Upload crash inputs (become regression tests)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: ignore
