# Agent PR policy (threat CI-7). Runs in TRUSTED contexts only (pull_request_target / issue_comment):
# the workflow definition AND the scripts come from the default branch, never from the PR, and no
# PR code is executed. Result: commit status "agent-pr-policy" on the PR head.
# Residual (see threat model): any same-repo workflow with statuses:write could also post that context.
name: agent-pr-policy

on:
  # Safe use: default-branch workflow + default-branch checkout; PR content is only read via the API.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  # Safe use: only the Codex integration's comments trigger a job; comment text is never interpolated.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created, edited]

permissions: {}

jobs:
  revoke:
    # separate job WITHOUT a concurrency group: a comment run can never cancel a revocation
    name: revoke owner approval on push
    # a new push OR a base-branch change changes what was approved
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'synchronize' || (github.event.action == 'edited' && github.event.changes.base))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/owner-approved-pipeline" > /dev/null 2>&1 || true

  policy:
    name: agent PR policy (publishes status)
    needs: revoke
    if: >-
      always() && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.comment.user.type == 'Bot'))
    concurrency:
      group: agent-pr-policy-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate and publish (every outcome publishes a status)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) || { echo "AGENT cannot resolve PR head"; exit 1; }
          broken=0
          if bash scripts/agent-pr-facts.sh "$REPO" "$PR" facts > facts.log 2>&1; then
            if bash scripts/agent-pr-policy.sh facts > policy.out 2>&1; then rc=0; else rc=$?; fi
            # a real decision always prints author_kind= and exits 0 (ok) or 1 (rejected)
            if ! grep -q '^author_kind=' policy.out || [ "$rc" -gt 1 ]; then broken=1; rc=1; fi
          else
            cat facts.log; echo "AGENT facts collection failed" > policy.out; rc=1; broken=1
          fi
          cat policy.out; cat policy.out >> "$GITHUB_STEP_SUMMARY"
          state=failure; [ "$rc" = 0 ] && state=success
          desc=$(grep -m1 -E '^AGENT ' policy.out | cut -c1-140)
          gh api "repos/$REPO/statuses/$head" -f state="$state" -f context=agent-pr-policy \
            -f description="${desc:-no decision}" > /dev/null || { echo "AGENT status publish failed"; exit 1; }
          # The DECISION lives only in the required status "agent-pr-policy". This job is green when the
          # decision was published (either way), red only when evaluation/publication itself broke.
          echo "published agent-pr-policy=$state for $head"
          # green job = a decision was made and published (pass or reject); red = evaluation itself broke
          [ "$broken" = 0 ] || { echo "AGENT evaluation broken (status published fail-closed)"; exit 1; }
