# Agent PR policy (threat CI-7). The policy scripts always come from the DEFAULT branch,
# never from the PR, so a PR cannot weaken the check that judges it.
# Result is published as commit status "agent-pr-policy" on the PR head; issue_comment
# re-evaluates when Codex updates its review-state comment.
name: agent-pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Safe use: runs only for the Codex bot's comments on PRs, checks out the DEFAULT branch,
  # never executes PR code and never interpolates comment text (only the PR number via env).
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created, edited]

permissions: {}

concurrency:
  group: agent-pr-policy-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: agent PR policy
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Revoke owner approval on every new push
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/owner-approved-pipeline" > /dev/null 2>&1 || true
      - name: Collect facts and evaluate
        id: eval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          bash scripts/agent-pr-facts.sh "$REPO" "$PR" facts
          bash scripts/agent-pr-policy.sh facts > policy.out 2>&1; rc=$?
          cat policy.out; cat policy.out >> "$GITHUB_STEP_SUMMARY"
          echo "head=$(cat facts/head_sha.txt)" >> "$GITHUB_OUTPUT"
          echo "desc=$(grep -m1 -E '^AGENT ' policy.out | cut -c1-140)" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Publish commit status on the PR head
        if: always() && steps.eval.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.eval.outputs.head }}
          DESC: ${{ steps.eval.outputs.desc }}
          OUTCOME: ${{ steps.eval.outcome }}
        run: |
          state=failure; [ "$OUTCOME" = success ] && state=success
          gh api "repos/$REPO/statuses/$HEAD" -f state="$state" -f context=agent-pr-policy -f description="${DESC:-no decision}" > /dev/null
